name: Build APK
on: workflow_dispatch
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - name: Prepare Capacitor project
        run: |
          mkdir www && cp "$(ls index*.html | head -n1)" www/index.html
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          echo '{"appId":"ma.mafia.game","appName":"Mafia Maroc","webDir":"www","server":{"androidScheme":"http","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: mafia-maroc-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
